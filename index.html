
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRYaTECH Homepage</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0a0a0a;
      color: #00ccff;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      padding: 40px;
    }
    button {
      margin: 10px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #00ccff;
      border: none;
      color: #000;
      cursor: pointer;
    }
    .gold { background-color: #ffcc00; color: #000; }
    h2 { margin-top: 40px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <h2 id="countdownTitle">Next Drop Countdown</h2>
  <p style="font-style:italic; color:#fff;">“System Loading… Prepare for greatness.”</p>

  <div id="monteBox">
    <audio id="monteAudio" src="Monte_Hustle_30sec.wav"></audio>
    <h3>Monte – Hustle</h3>
    <button onclick="document.getElementById('monteAudio').play()">► Hear Monte</button>
  </div>

  <div id="mylaieBox">
    <audio id="mylaieAudio" src="Mylaie_30sec.wav"></audio>
    <h3 style="color: #ffcc00;">Mylaie – Vision</h3>
    <button class="gold" onclick="document.getElementById('mylaieAudio').play()">► Hear Mylaie</button>
  </div>

  <div id="shopButton">
    <button onclick="location.href='kids.html'">Visit the KIDS Store</button>
  </div>

  <script>
    gsap.from("#countdownTitle", { duration: 1, y: -50, opacity: 0, ease: "power2.out" });
    gsap.from("#monteBox", { duration: 1, x: -100, opacity: 0, delay: 0.5, ease: "power2.out" });
    gsap.from("#mylaieBox", { duration: 1, x: 100, opacity: 0, delay: 0.5, ease: "power2.out" });
    gsap.from("#shopButton", { duration: 1, scale: 0.8, opacity: 0, delay: 1, ease: "back.out(1.7)" });
  </script>
</body>
</html>
